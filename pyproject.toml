[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcript-intelligence"
version = "0.1.0"
description = "Turn 100 call transcripts into leadership-ready insights."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Transcript Intelligence Take-Home" },
]
keywords = ["nlp", "transcripts", "sentiment", "churn", "saas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
ti-pipeline    = "transcript_intelligence.pipeline:_cli"
ti-figures     = "transcript_intelligence.visualizations:_cli"
ti-walkthrough = "transcript_intelligence._cli:walkthrough"

[project.urls]
Homepage = "https://github.com/example/transcript-intelligence"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
transcript_intelligence = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
